<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CaseVault | Admin Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Admin CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            background-color: #0B0F14;
        }

        .admin-login-card {
            width: 100%;
            max-width: 430px;
            background-color: #151D26;
            border: 1px solid #27313D;
            border-radius: 12px;
            padding: 35px;
        }

        .admin-login-icon {
            font-size: 42px;
            color: #C62828;
        }

        .admin-login-title {
            color: #F5F5F5;
            font-weight: 700;
        }

        .admin-login-description {
            color: #9CA3AF;
        }

        .admin-login-card label {
            color: #F5F5F5;
            margin-bottom: 8px;
        }

        .admin-login-card .form-control {
            background-color: #0B0F14;
            border: 1px solid #27313D;
            color: #F5F5F5;
            padding: 11px 13px;
        }

        .admin-login-card .form-control:focus {
            border-color: #C62828;
            box-shadow: 0 0 0 0.2rem rgba(198, 40, 40, 0.2);
        }

        .admin-login-card .form-control::placeholder {
            color: #6B7280;
        }

        .admin-login-btn {
            background-color: #C62828;
            color: white;
            border: none;
            padding: 11px;
            font-weight: 600;
        }

        .admin-login-btn:hover {
            background-color: #E53935;
            color: white;
        }

        .admin-login-link {
            color: #E53935;
            text-decoration: none;
        }

        .admin-login-link:hover {
            text-decoration: underline;
        }

        .admin-login-message {
            font-size: 14px;
        }

        .admin-notice {
            background-color: #10161D;
            border: 1px solid #27313D;
            color: #9CA3AF;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }

        @media (max-width: 576px) {
            .admin-login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="admin-login-page">

        <div class="admin-login-card">

            <!-- Admin Logo -->
            <div class="text-center mb-4">

                <div class="admin-login-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>

                <h2 class="admin-login-title mt-2">
                    Admin Login
                </h2>

                <p class="admin-login-description">
                    Access the CaseVault administration panel.
                </p>

            </div>

            <!-- Login Form -->
            <form id="adminLoginForm" novalidate>

                <!-- Email -->
                <div class="mb-3">

                    <label for="adminEmail" class="form-label">
                        Admin Email
                    </label>

                    <input type="email" class="form-control" id="adminEmail" placeholder="Enter admin email">

                    <small class="text-danger" id="adminEmailError"></small>

                </div>

                <!-- Password -->
                <div class="mb-3">

                    <label for="adminPassword" class="form-label">
                        Password
                    </label>

                    <input type="password" class="form-control" id="adminPassword" placeholder="Enter admin password">

                    <small class="text-danger" id="adminPasswordError"></small>

                </div>

                <!-- General Message -->
                <div id="adminLoginMessage" class="admin-login-message mb-3"></div>

                <!-- Login Button -->
                <button type="submit" class="btn admin-login-btn w-100">

                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login as Admin

                </button>

            </form>

            <!-- Notice -->
            <div class="admin-notice mt-4">

                <i class="bi bi-info-circle me-1"></i>

                This page is intended for authorized CaseVault
                administrators only.

            </div>

            <!-- Back to Client Website -->
            <div class="text-center mt-3">

                <a href="../client-side/home.html" class="admin-login-link small">

                    <i class="bi bi-arrow-left me-1"></i>
                    Back to CaseVault

                </a>

            </div>

        </div>

    </main>

    <script src="../js/login-validation.js"></script>
</body>

</html>

</body>

</html>
