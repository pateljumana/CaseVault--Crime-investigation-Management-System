
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CaseVault | Client Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Existing CaseVault CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* Login Page */

        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            background-color: var(--bg-color, #0B0F14);
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background-color: var(--card-color, #151D26);
            border: 1px solid var(--border-color, #27313D);
            border-radius: 12px;
            padding: 35px;
        }

        .login-logo {
            font-size: 42px;
            color: var(--accent-color, #C62828);
        }

        .login-title {
            color: var(--text-color, #F5F5F5);
            font-weight: 700;
        }

        .login-description {
            color: var(--muted-color, #9CA3AF);
        }

        .login-card label {
            color: var(--text-color, #F5F5F5);
            margin-bottom: 8px;
        }

        .login-card .form-control {
            background-color: #0B0F14;
            border: 1px solid #27313D;
            color: #F5F5F5;
            padding: 11px 13px;
        }

        .login-card .form-control:focus {
            border-color: #C62828;
            box-shadow: 0 0 0 0.2rem rgba(198, 40, 40, 0.2);
        }

        .login-card .form-control::placeholder {
            color: #6B7280;
        }

        .login-btn {
            background-color: #C62828;
            color: white;
            border: none;
            padding: 11px;
            font-weight: 600;
        }

        .login-btn:hover {
            background-color: #E53935;
            color: white;
        }

        .login-link {
            color: #E53935;
            text-decoration: none;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .login-message {
            font-size: 14px;
        }

        .demo-notice {
            background-color: #10161D;
            border: 1px solid #27313D;
            color: #9CA3AF;
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
        }

        @media (max-width: 576px) {
            .login-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="login-logo">
                    <i class="bi bi-shield-lock"></i>
                </div>

                <h2 class="login-title mt-2">Welcome Back</h2>

                <p class="login-description">
                    Sign in to continue your investigation.
                </p>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>

                    <input type="email"
                           class="form-control"
                           id="email"
                           placeholder="Enter your email">

                    <small class="text-danger" id="emailError"></small>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>

                    <input type="password"
                           class="form-control"
                           id="password"
                           placeholder="Enter your password">

                    <small class="text-danger" id="passwordError"></small>
                </div>

                <!-- Remember Me -->
                <div class="d-flex justify-content-between align-items-center mb-4">

                    <div class="form-check">
                        <input class="form-check-input"
                               type="checkbox"
                               id="rememberMe">

                        <label class="form-check-label small"
                               for="rememberMe">
                            Remember me
                        </label>
                    </div>

                    <a href="#" class="login-link small">
                        Forgot password?
                    </a>

                </div>

                <!-- General Message -->
                <div id="loginMessage"
                     class="login-message mb-3"></div>

                <!-- Login Button -->
                <button type="submit"
                        class="btn login-btn w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>
                    Login
                </button>

            </form>

            <!-- Register Link -->
            <p class="text-center mt-4 mb-0 login-description">
                Don't have an account?
                <a href="register.html" class="login-link">
                    Register here
                </a>
            </p>

            <!-- Demo Notice -->
            <div class="demo-notice mt-4">
                <i class="bi bi-info-circle me-1"></i>
                Demo login: enter a valid email and a password
                containing at least 8 characters.
            </div>

            <!-- Back to Home -->
            <div class="text-center mt-3">
                <a href="home.html" class="login-link small">
                    <i class="bi bi-arrow-left me-1"></i>
                    Back to Home
                </a>
            </div>

        </div>

    </main>
    <!-- External JavaScript Validation -->
<script src="../js/login-validation.js"></script>
</body>
</html>
